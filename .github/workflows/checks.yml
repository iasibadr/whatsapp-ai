name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '9.6.1'
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Publication scans
        run: |
          python3 scripts/privacy_scan.py
          python3 scripts/privacy_scan.py --apk downloads/whatsapp-ai-0.22.apk
          cd downloads && sha256sum -c SHA256SUMS
      - name: Build and tests
        run: gradle :app:assembleRelease  --no-daemon
      - name: Java policy checks
        run: python3 scripts/test_policies.py
      - name: Lint diagnostic (known findings documented in AUDIT.md)
        continue-on-error: true
        run: gradle :app:lintRelease --no-daemon
