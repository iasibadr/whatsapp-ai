name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          gradle-version: '9.6.1'
      - name: Install Android platform
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Publication scans
        run: |
          python3 scripts/privacy_scan.py
          python3 scripts/privacy_scan.py --apk downloads/whatsapp-ai-0.22.apk
          cd downloads && sha256sum -c SHA256SUMS
      - name: Build and tests
        run: gradle :app:assembleRelease  --no-daemon
      - name: Java policy checks
        run: python3 scripts/test_policies.py
      - name: Lint diagnostic (known findings documented in AUDIT.md)
        continue-on-error: true
        run: gradle :app:lintRelease --no-daemon
