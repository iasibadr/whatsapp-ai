plugins { id 'com.android.application' }
android {
    namespace 'live.pharmaradio.whatsappai'
    compileSdk 35
    buildFeatures { buildConfig false }
    defaultConfig { applicationId 'live.pharmaradio.whatsappai'; minSdk 33; targetSdk 35; versionCode 22; versionName '0.22-beta' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets { main { manifest.srcFile '../AndroidManifest.xml'; java.srcDirs = ['../java']; res.srcDirs = ['../res']; assets.srcDirs = ['../assets'] } }
    defaultConfig { ndk { abiFilters 'arm64-v8a' } }
    packaging { jniLibs { useLegacyPackaging true }; resources { excludes += ['META-INF/INDEX.LIST', 'META-INF/DEPENDENCIES', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA']; merges += ['META-INF/services/**'] } }

}
dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.github.MuntashirAkon:libadb-android:3.1.1'
    implementation 'com.github.MuntashirAkon.spake2-java:spake2-android:2.2.1'
    implementation 'org.conscrypt:conscrypt-android:2.5.3'
    implementation 'org.bouncycastle:bcpkix-jdk15to18:1.81'
    testImplementation 'junit:junit:4.13.2'
}

configurations.matching { it.name in ['releaseRuntimeClasspath', 'releaseCompileClasspath', 'debugRuntimeClasspath', 'debugCompileClasspath'] }.configureEach { resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:2.1.0', 'com.squareup.okio:okio-jvm:3.6.0', 'androidx.annotation:annotation-jvm:1.9.1' }
